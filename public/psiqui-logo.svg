<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fondo cuadrado redondeado slate -->
  <rect width="100" height="100" rx="22" fill="#1e293b"/>

  <!-- Nodos — escalados de 48x48 a 100x100 (factor ~2.08) -->
  <!-- Nodo principal (cx=26,cy=26 → 54,54) -->
  <circle cx="54" cy="54" r="8.5" fill="white"/>

  <!-- cx=14,cy=14 → 29,29 -->
  <circle cx="29" cy="29" r="7" fill="white" opacity="0.9"/>

  <!-- cx=34,cy=12 → 71,25 -->
  <circle cx="71" cy="25" r="5" fill="white" opacity="0.75"/>

  <!-- cx=9,cy=30 → 19,63 -->
  <circle cx="19" cy="63" r="4" fill="white" opacity="0.6"/>

  <!-- cx=38,cy=28 → 79,58 -->
  <circle cx="79" cy="58" r="5" fill="white" opacity="0.8"/>

  <!-- cx=20,cy=40 → 42,83 -->
  <circle cx="42" cy="83" r="4" fill="white" opacity="0.55"/>

  <!-- Líneas -->
  <line x1="29" y1="29" x2="71" y2="25" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="29" y1="29" x2="54" y2="54" stroke="white" stroke-width="3" opacity="0.5"/>
  <line x1="29" y1="29" x2="19" y2="63" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="71" y1="25" x2="54" y2="54" stroke="white" stroke-width="2.5" opacity="0.45"/>
  <line x1="71" y1="25" x2="79" y2="58" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="54" y1="54" x2="79" y2="58" stroke="white" stroke-width="2.5" opacity="0.45"/>
  <line x1="54" y1="54" x2="42" y2="83" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="19" y1="63" x2="42" y2="83" stroke="white" stroke-width="1.5" opacity="0.2"/>
</svg>
